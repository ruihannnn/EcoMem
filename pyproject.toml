[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lessmem"
version = "0.1.0"
description = "LessMem: Lightweight Memory System for LLM-based Conversational Agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["LLM", "memory", "conversation", "narrative", "clustering"]

dependencies = [
    "numpy>=1.26.4",
    "chromadb>=1.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.60.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
compress = [
    "llmlingua>=0.2.0",
]
eval = [
    "pandas>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]
